# Verbosity of the logging output. The valid log levels, from least verbose to
# most verbose, are:
#
# * error: Fatal errors only
# * warn:  Includes ^^ + recoverable errors
# * info:  Includes ^^ + fan mode change messages on startup/shutdown
# * debug: Includes ^^ + a status message with the temperature and duty cycle
#          during each fan update interval (useful for tuning the fan curve)
# * trace: Includes ^^ + details about parsed values and the raw IPMI commands
#
# (Note: This option is ignored if the RUST_LOG environment variable is set)
log_level = "debug"

# Named curves. Define a curve once here and name it with `curve` on any
# number of sources and zones, in place of their own `steps`. The key after
# `curves.` is the name. `steps` follows the rules of a zone's `steps` below.
# A source or zone that names a curve gets the curve's steps, so the rules of
# its own `steps` apply too: a source cannot name a curve with no steps.
#
# `hysteresis` is the number of degrees Celsius the curve's temperature must
# fall before its duty cycle follows, as the zone's `hysteresis` does for
# inline `steps`. A named curve always uses its own `hysteresis`, never the
# zone's. The default is 0, which follows every reading. Each source or zone
# that names the curve holds its own temperature. A curve that nothing names
# is still validated.
[curves.gpu]
steps = [
  { temp = 60, dcycle = 40 },
  { temp = 90, dcycle = 100 }
]
hysteresis = 3

# Definition of a logical fan zone.
[[zones]]
# IPMI session. If unspecified, the `default` session is used, which uses the
# local in-band IPMI device (eg. /dev/ipmi0). Sessions are defined below in the
# `sessions` section. A session opens only when a zone on it has a
# `supermicro` fan, so a config with only `hwmon` fans needs no IPMI device.
session = "default"

# Fans driven by this logical zone, each set to the zone's duty cycle. A
# `supermicro` fan is one IPMI fan zone of the board that `session` reaches.
# Each fan may be listed once, and two zones on one session cannot drive the
# same IPMI zone. Two session names that reach the same board are not
# detected, so do not drive one board through two sessions.
#
# A `hwmon` fan, `{ type = "hwmon", chip = "nct6798", pwm = 2 }`, is the PWM
# channel `pwm2` of the hwmon chip whose `name` file holds `chip`. `pwm`
# starts at 1. On startup the program saves `pwm2_enable` and switches the
# channel to manual control at full speed. On exit it sets the channel to full
# speed and writes the saved `pwm2_enable` back when it is 2 or more, a mode
# the driver defines and on most chips an automatic one. After a saved 0 or 1
# the channel stays manual at full speed, because the kernel's pwm-fan driver
# reads 0 as fan off.
# Two zones cannot drive the same chip and channel. See the hwmon zone example
# below.
fans = [
  { type = "supermicro", zone = 0 },
  { type = "supermicro", zone = 1 },
]

# The older form of `fans`, which lists the IPMI zone numbers of `supermicro`
# fans. `ipmi_zones = [0, 1]` drives the same fans as `fans` above. A zone sets
# either `fans` or `ipmi_zones`, not both. A number repeated in this list is
# driven once.
#ipmi_zones = [0, 1]

# Number of seconds to wait between fan update interations. If unspecified, the
# default interval is 1 second.
interval = 1

# Number of retries to query temperature sources in each update. The sources
# that are not `ipmi` are read first, in the order below, and the ipmi sources
# last, in one IPMI query. Only a source that fails is read again; earlier
# versions read every source again. All sources of the zone share these
# retries, so a source that uses them up leaves none for the sources read after
# it. A source that failed in the previous update gets one attempt and no
# retries until it reads again. A source that still fails after the last retry
# is handled by its `on_failure` (see the sources below); by default, the
# program exits. The default is 2 retries (3 attempts in total).
#
# This bounds the number of waits in an update, not its duration. smartctl and
# hdparm are stopped after 30 seconds and nvidia-smi after 5 seconds. If a
# stopped program does not exit, its source does not start it again until the
# old process is gone; until then that source fails at once. Other sources
# still run, including sources that run the same program.
#retries = 2

# Number of milliseconds to wait before retrying when querying a temperature
# source fails. This field has no effect if `retries` is set to 0.
#retry_delay_ms = 500

# Temperature sources to use for measurement.
sources = [
  # IPMI sensor source. The sensor's units must be `degrees C`. The zone must
  # have a `supermicro` fan, because only such a zone opens an IPMI session.
  { type = "ipmi", sensor = "CPU Temp" },

  # Local file source. File formatting rules:
  #
  # * Must be in ASCII encoding
  # * Units must be milli-degrees Celsius (1/1000 °C)
  # * No characters other than numbers and whitespace are permitted
  #
  # The path must be a regular file after symlinks are followed; a FIFO,
  # directory or device fails the source without being read.
  #
  # The thermal_zone sysfs paths on Linux satisfy these conditions.
  # { type = "file", path = "/sys/class/thermal/thermal_zone1/temp" },

  # hwmon source. This reads `temp<input>_input` of the hwmon chip whose
  # `name` file holds `chip`, in milli-degrees Celsius, and rounds up to whole
  # degrees. A reading above 255 °C gives 255. A reading below 0 °C fails the
  # source, because an open probe reports a negative value; a real sub-zero
  # temperature then fails the source as well. When the chip has a
  # `temp<input>_fault` file and it holds a value other than 0, or it cannot
  # be read or parsed, the source fails. `input` starts at 1.
  #
  # The chip is found by name on every read, never by its hwmonN number,
  # which can change between boots. A name that no chip or more than one chip
  # has fails the source. To list the names, run:
  #
  #   grep . /sys/class/hwmon/*/name
  # { type = "hwmon", chip = "k10temp", input = 1 },

  # HDD S.M.A.R.T. source. Disks that are spun down may not report a
  # temperature reading, leading to an error. This internally runs:
  #
  #   smartctl -j -A -n standby <block_dev>
  #
  # and requires smartmontools >= 7.0 to be installed. If smartctl does not
  # exit within 30 seconds, it is killed and the reading fails.
  # { type = "smart", block_dev = "/dev/disk/by-id/ata-ST6000VN001-2BB186_ZR12WE0S" },
  # { type = "smart", block_dev = "/dev/disk/by-id/ata-ST6000VN0033-2EE110_ZAD8N3FM" },
  # { type = "smart", block_dev = "/dev/disk/by-id/ata-ST6000VN0033-2EE110_ZAD8R2G3" },
  # { type = "smart", block_dev = "/dev/disk/by-id/ata-ST6000VN0033-2EE110_ZAD8R31T" },

  # "hdparm -H" source. This is specific to some Hitachi/HGST/WD drives and
  # allows the HDD temperature to be queried even when the drive is spun down.
  # This requires hdparm to be installed. If hdparm does not exit within 30
  # seconds, it is killed and the reading fails.
  # { type = "hdparm", block_dev = "/dev/disk/by-id/..." },

  # NVIDIA GPU source. This internally runs:
  #
  #   nvidia-smi -i <gpu> --query-gpu=temperature.gpu --format=csv,noheader,nounits
  #
  # and requires nvidia-smi from the installed NVIDIA driver. If nvidia-smi
  # does not exit within 5 seconds, it is killed and the reading fails.
  #
  # Select the card by its PCI bus id or its UUID. A GPU index such as `0` is
  # rejected, because the index order can change between boots. To list the
  # bus ids and UUIDs, run:
  #
  #   nvidia-smi --query-gpu=pci.bus_id,uuid --format=csv
  # { type = "nvidia", gpu = "00000000:81:00.0" },
  # { type = "nvidia", gpu = "GPU-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" },

  # Any source can carry its own `steps`, with the same rules as the zone's
  # `steps` below, except that the list must be non-empty. Such a source maps
  # its temperature through its own curve and does not feed the zone
  # temperature. This suits a GPU, which runs hotter than a CPU and needs a
  # curve of its own.
  #
  # Any source can also carry `on_failure`, which decides what the zone does
  # when the source still fails after its retries:
  #
  # * { type = "exit" }: The program exits, which sets the fans to 100% and
  #   restores the original fan mode. This is the default.
  # * { type = "ignore" }: The source is left out until it reads again, and
  #   the other sources drive the fans. A hot device that cannot be read then
  #   no longer raises the fans, so use this only for a source that another
  #   source covers.
  # * { type = "dcycle", dcycle = 80 }: The source is left out, and the zone
  #   runs at 80% or more until the source reads again. Use this for a device
  #   that produces much heat, such as a GPU.
  #
  # A zone in which no source has a reading runs at 100%. A failing source is
  # still tried once in every update.
  # { type = "nvidia", gpu = "00000000:81:00.0", steps = [{ temp = 60, dcycle = 40 }, { temp = 90, dcycle = 100 }], on_failure = { type = "dcycle", dcycle = 80 } },

  # In place of `steps`, a source can name a curve from the `curves` section
  # above with `curve`. A source cannot have both. Several sources can name
  # one curve; each maps its own temperature through it. Such a source counts
  # as a source with its own `steps` everywhere in this file.
  # { type = "nvidia", gpu = "00000000:82:00.0", curve = "gpu", on_failure = { type = "dcycle", dcycle = 80 } },

  # Any source can also carry `smoothing_samples`, a number from 1 to 255. The
  # source then feeds the mean of its last `smoothing_samples` readings,
  # rounded down, in place of each reading, so a short spike moves the fans
  # less. The mean comes before `aggregation`, the source's own `steps` and
  # `hysteresis`. The default is 1, which uses each reading as it is. A failed
  # read drops the stored readings, so the source starts again from fresh
  # readings.
  #
  # The count is in updates, so the mean covers about `smoothing_samples`
  # times `interval` seconds: 3 with an interval of 1 is about 3 seconds. This
  # also delays the response to real heat. The mean holds only the readings
  # since the start or since the source last failed, so the first reading
  # after either acts at once. After a sustained rise, the
  # `smoothing_samples`-th hot reading pushes out the last cooler one, and the
  # duty cycle can reach its target sooner if the mean crosses the top step
  # first. Use it for a sensor whose readings jump, not for a device that
  # heats quickly.
  # { type = "ipmi", sensor = "System Temp", smoothing_samples = 3 },
]

# Method of aggregating the temperatures of the sources without their own
# `steps` into the zone temperature. By default, the maximum temperature is
# used. It is also possible to use the average temperature, which divides by
# the number of temperatures used and rounds down. In case there are
# lower-bound outliers in the temperature readings, the `top` parameter can be
# set to only consider the `n` highest temperatures. When every source has its
# own `steps`, this is not used to compute the duty cycle, but it is still
# validated.
#aggregation = { type = "maximum" }
#aggregation = { type = "average" }
#aggregation = { type = "average", top = 3 }

# List of steps for mapping temperatures to duty cycles. The temperatures are
# in degrees Celsius and the PWM duty cycles are fan speed percentages. At 0%
# duty cycle, the fans are completely turned off and at 100% duty cycle, the
# fans are at the maximum speed. Be careful using low percentages as the fans
# may stall.
#
# The algorithm follows the rules below:
#
# * If the current temperature is lower than the first step's `temp`, then the
#   first step's `dcycle` is used.
# * If the current temperature is higher than the last step's `temp`, then the
#   last step's `dcycle` is used.
# * If there are no steps, then the duty cycle is set to 100%.
# * Otherwise, the duty cycle is linearly scaled between the step below the
#   current temperature and the step above the current temperature.
#
# Note that these rules mean that having a single step will result in a fixed
# fan speed. Also, the list must be sorted, `temp` must be strictly increasing,
# and `dcycle` must be increasing.
#
# These steps map the zone temperature. When every source has its own `steps`,
# the zone has no temperature, so this list and `aggregation` are not used to
# compute the duty cycle, and this list may be omitted. They are still
# validated when given. Otherwise this list is required, and when some sources
# have `steps` and others do not, it must be non-empty.
steps = [
  { temp = 40, dcycle = 40 },
  { temp = 70, dcycle = 70 }
]

# In place of `steps`, the zone can name a curve from the `curves` section
# with `curve`, here the `gpu` curve defined above. The zone cannot have both,
# so remove `steps` when you set `curve`. The rules above for the zone's
# `steps` apply to the named curve's steps.
#curve = "gpu"

# Method of combining the duty cycles of the zone's curves: the zone curve and
# the curve of each source with `steps`. The default, maximum, uses the highest
# duty cycle of any curve. Average takes the mean, rounded up, and `top` limits
# it to the `n` highest duty cycles. Each curve counts once, however many
# sources feed it. Average can give a duty cycle below the highest one a curve
# asks for, so the source behind that curve may run hotter than its curve
# intends.
#duty_aggregation = { type = "maximum" }
#duty_aggregation = { type = "average" }

# Degrees Celsius a curve's temperature must fall before its duty cycle follows.
# A rise is always followed at once, so the fans speed up without delay but do
# not slow down for a fall of less than this. Each curve holds its own
# temperature. The default is 0, which follows every reading.
#
# This applies only to inline `steps`: the zone's and those of each source. A
# named curve uses the `hysteresis` of its entry in `curves`.
#hysteresis = 3

# More fan zones can be added. Each drives fans that no other zone drives, so
# to enable this example, remove zone 1 from the first zone's `fans`.
#[[zones]]
#fans = [{ type = "supermicro", zone = 1 }]
#interval = 5
#sources = [
#    { type = "smart", block_dev = "/dev/disk/by-id/..." },
#    { type = "smart", block_dev = "/dev/disk/by-id/..." },
#]
#aggregation = { type = "average" }
#steps = [
#    { temp = 30, dcycle = 30 },
#    { temp = 70, dcycle = 70 },
#]

# A zone with only hwmon fans and sources needs no IPMI device. It cannot
# read `ipmi` sources: an `ipmi` source needs a `supermicro` fan in the same
# zone. To list the chip names, run `grep . /sys/class/hwmon/*/name`.
#[[zones]]
#fans = [{ type = "hwmon", chip = "nct6798", pwm = 2 }]
#sources = [{ type = "hwmon", chip = "k10temp", input = 1 }]
#steps = [
#    { temp = 40, dcycle = 30 },
#    { temp = 80, dcycle = 100 },
#]

# Optional section for defining other IPMI sessions. This is not needed when
# connecting to the local machine.
#
# The key is the name of the session, which can be any arbitrary non-empty
# string, and the value is either a local or remote session configuration.
[sessions]
# Implicit default session for connecting to local IPMI. If this is changed, it
# will take effect in any zone that doesn't explicitly specify another session.
"default" = { type = "local" }

# Example of a remote session.
#"remote" = { type = "remote", hostname = "<host>", username = "<username>", password = "<password>" }

# Example of a remote session using ipmitool arguments. This configuration
# format is deprecated and only exists for backwards compatibility.
#"remote_compat" = ["-I", "lanplus", "-H", "<host>", "-U", "<username>", "-P", "<password>"]
