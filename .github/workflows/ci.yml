---
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    name: Build project
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get Rust LLVM target triple
        id: get_target
        shell: bash
        run: |
          echo -n 'name=' >> "${GITHUB_OUTPUT}"
          RUSTC_BOOTSTRAP=1 rustc -Z unstable-options --print target-spec-json \
              | jq -r '."llvm-target"' \
              >> "${GITHUB_OUTPUT}"

      - name: Install clippy
        run: rustup component add clippy

      - name: Install system dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install clang libfreeipmi-dev libipmimonitoring-dev pkg-config

      - name: Run clippy checks in debug mode
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build in debug mode
        run: cargo build --verbose

  nix:
    name: Check and build flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.2

      - name: Check flake
        run: nix flake check --no-update-lock-file

      - name: Build package
        run: nix build --no-update-lock-file .#default

  actions_lock:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        run: gh actions-lock --verify
